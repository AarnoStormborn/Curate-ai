# ============================================================================
# Curate AI — Docker Compose
# ============================================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: curate-backend
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/curate.db
      HF_CACHE: /app/data/hf-cache
      PORT: 4000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # LLM reranking (pi SDK): pass a key for containers; local dev uses ~/.pi/agent login
      RERANK_PROVIDER: ${RERANK_PROVIDER:-opencode-go}
      RERANK_MODEL: ${RERANK_MODEL:-deepseek-v4-flash}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_TOP_N: ${RERANK_TOP_N:-25}
      # Optionally override the local embedding model / dimension:
      # EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Xenova/all-MiniLM-L6-v2}
      # EMBEDDING_DIM: 384
    volumes:
      - curate-data:/app/data
    networks:
      - curate-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: curate-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT:-8080}:80"
    networks:
      - curate-net

networks:
  curate-net:
    driver: bridge

volumes:
  curate-data:
    driver: local
